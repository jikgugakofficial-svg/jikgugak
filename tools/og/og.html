@font-face{font-family:BHS;src:url(../cards/fonts/BlackHanSans-Regular.ttf)}

*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;font-family:PT,sans-serif;letter-spacing:-0.02em}
.v{position:absolute;inset:0;display:none}

.brand{display:flex;align-items:center;gap:18px}
.word{font-family:BHS;line-height:1}
.chip{display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 24px;border-radius:999px;font-weight:800;font-size:26px}
.dot{width:12px;height:12px;border-radius:50%}
.g{background:#E3F3EA;color:#0E7C4A}.g .dot{background:#0E7C4A}
.m{background:#FFF1CC;color:#8A5A00}.m .dot{background:#C98A00}
.n{background:#E8EEFC;color:#2F5FD0}.n .dot{background:#2F5FD0}

/* A: 흰 바탕 + 오른쪽 판정 카드 */
.a{background:#FFFFFF}
.a .left{position:absolute;left:84px;top:84px;width:560px}
.a .word{font-size:46px;color:#D23A10}
.a h1{margin-top:74px;font-size:66px;line-height:1.18;font-weight:850;color:#16181D}
.a h1 em{font-style:normal;color:#D23A10}
.a p{margin-top:26px;font-size:26px;line-height:1.5;color:#5B6170;font-weight:500}
.a .panel{position:absolute;right:84px;top:84px;width:400px;height:462px;border-radius:32px;background:#F5F6F8;padding:40px 36px;display:flex;flex-direction:column;gap:18px}
.a .row{background:#fff;border-radius:20px;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;font-size:22px;color:#5B6170;font-weight:600}
.a .bar{height:14px;border-radius:7px;background:#D5D8DE}
.a .row b{display:block;width:120px}
.a .verdict{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.a .stripe{position:absolute;left:0;top:0;bottom:0;width:14px;background:#D23A10}

/* B: 주황 바탕 정돈 */
.b{background:#D23A10;color:#fff}
.b .inner{position:absolute;left:96px;top:92px;right:96px}
.b .word{font-size:52px}
.b h1{margin-top:66px;font-size:74px;line-height:1.16;font-weight:850}
.b p{margin-top:24px;font-size:27px;font-weight:500;color:#FFE3D8}
.b .chips{position:absolute;left:96px;bottom:84px;display:flex;gap:14px}
.b .chip{background:#fff}
.b .corner{position:absolute;right:-120px;top:-120px;width:460px;height:460px;border:56px solid rgba(255,255,255,.10);border-radius:50%}
.b .mark{position:absolute;right:96px;bottom:84px;width:188px;height:188px}

/* C: 남색 바탕 */
.c{background:#1F2E57;color:#fff}
.c .inner{position:absolute;left:96px;top:92px;width:640px}
.c .word{font-size:50px}
.c h1{margin-top:68px;font-size:70px;line-height:1.18;font-weight:850}
.c h1 em{font-style:normal;color:#FF8A5C}
.c p{margin-top:24px;font-size:26px;color:#C9D2E8;font-weight:500}
.c .stack{position:absolute;right:96px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:16px;align-items:flex-end}
.c .stack .chip{height:64px;font-size:30px;padding:0 30px}
.c .rule{position:absolute;left:96px;bottom:70px;right:96px;height:2px;background:rgba(255,255,255,.12)}
.c .url{position:absolute;left:96px;bottom:30px;font-size:22px;color:#8E9AC0;font-weight:600}
