# 오늘 바뀐 페이지를 IndexNow(빙 등)에 알려요. ChatGPT 검색이 빙 색인을 써서 AI 답변 반영이 빨라져요.
# 매일 12:10 KST(11:30 재계산 뒤) 한 번. 수동 실행에서 all=true면 사이트맵 전체(처음 한 번만).
name: indexnow
on:
  schedule:
    - cron: '10 3 * * *'
  workflow_dispatch:
    inputs:
      all:
        description: '사이트맵 전체 보내기'
        type: boolean
        default: false
concurrency: indexnow
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs ${{ inputs.all && '--all' || '' }}
