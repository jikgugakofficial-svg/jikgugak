# 쿠팡 파트너스 공식 API 작업. 키는 저장소 Settings → Secrets and variables → Actions 의
# COUPANG_ACCESS_KEY · COUPANG_SECRET_KEY 에만 넣어요.
# 자동 실행(매시간 hourly): 인기 직구 후보 2개 자동 발굴(data/candidates.json) + 등록 상품 가격 자동 반영(쿠팡 5개·알리 3개, 10/27 22시~) + 인기 검색어 미리 찾기, 실적 매일. 끄려면 아래 schedule 두 줄을 지워요.
# 손으로 돌릴 땐 Actions → coupang → Run workflow 에서 mode 를 골라요.
name: coupang
on:
  schedule:
    - cron: '41 * * * *'   # 이 작업 1시간 7회(후보 2 + 가격 5) + 사이트 실시간 검색 1회(쿠팡 제한 10회보다 적게)
    - cron: '20 0 * * *'   # 매일 09:20 KST 실적 리포트(어제까지 7일)
  workflow_dispatch:
    inputs:
      mode:
        description: 'check(연결 확인) · deeplink(링크 만들기) · links(새 상품 알리·쿠팡 링크) · prices(가격 대조) · images(사진 없는 상품에 쿠팡 제공 사진) · discover(후보 발굴) · hourly · report(실적)'
        default: check
      args:
        description: 'deeplink면 쿠팡 일반 주소(띄어쓰기로 여러 개), prices면 개수, report면 일수'
        default: ''
permissions:
  contents: write
concurrency: coupang
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run
        id: run
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '20 0 * * *' && 'report' || 'hourly') }}
          ARGS: ${{ github.event.inputs.args || '' }}
        run: node scripts/coupang.mjs "$MODE"
      - name: Save results
        if: always()
        run: |
          git config user.name "jikgugak-bot"
          git config user.email "jikgugak.official@gmail.com"
          git add data/coupang-*.json data/candidates.json data/new-links.json data/ali-prices.json data/price-alerts.json data/products.json 2>/dev/null || true
          # 사이트 가격이 바뀌었으면 [skip ci] 없이 올려서 Vercel이 바로 다시 배포해요
          if git diff --cached --quiet -- data/products.json; then MSG="쿠팡 API 결과 기록 [skip ci]"; else MSG="가격 자동 반영(쿠팡·알리 API)"; fi
          git diff --cached --quiet || (git commit -m "$MSG" && git pull --rebase && git push)
