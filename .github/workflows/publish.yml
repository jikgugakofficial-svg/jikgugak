# 승인된 홍보 글을 Meta 공식 API로 인스타그램·스레드에 올려요.
# content/<폴더>/publish.json 의 "approved": true 이고, 예약 시간이 지났고, 아직 안 올린 것만 처리해요.
# 비밀값 IG_TOKEN·THREADS_TOKEN 은 GitHub 저장소 Settings → Secrets and variables → Actions 에만 넣어요.
name: publish
on:
  push:
    branches: [main]
    paths: ['content/**/publish.json']
  schedule:
    - cron: '7 * * * *'
    - cron: '53 8 * * *'   # 매일 17:53 KST 예약분(v1 게시 시각)
    - cron: '23 3 * * *'   # 매일 12:23 KST 예약분(스레드 낮 글)
    - cron: '26 3 * * *'   # 매일 12:26 KST 예약분(영상 광고 릴스 12:25)
    - cron: '23 11 * * *'  # 매일 20:23 KST 예약분(스레드 저녁 글)
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish(게시) 또는 check(연결 확인만)'
        default: check
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Publish or check
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: node tools/publish/run.mjs ${{ github.event.inputs.mode == 'check' && 'check' || '' }}
      - name: Save results
        run: |
          git config user.name "jikgugak-bot"
          git config user.email "jikgugak.official@gmail.com"
          git add -A content/ || true
          git diff --cached --quiet || (git commit -m "게시 결과 기록 [skip ci]" && git pull --rebase && git push)
