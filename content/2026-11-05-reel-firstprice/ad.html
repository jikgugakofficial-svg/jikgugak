<!doctype html>
<html lang="ko"><head><meta charset="utf-8">

<style>
  @font-face{font-family:D;src:url("../../tools/tvc/fonts/Freesentation-9Black.ttf")}

<body>
<div id="bg2"></div>
<div id="cam"><svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920"><g id="g"></g><g id="fx"></g></svg></div>
<svg id="ui" width="1080" height="1920" viewBox="0 0 1080 1920"><g id="site"></g><g id="cta"></g></svg>

<svg id="s2" width="1080" height="1920" viewBox="0 0 1080 1920"><g id="logo"></g></svg>
<div id="words"></div>
<script src="timeline.js"></script>
<script>
document.fonts.load('900 100px D'); document.fonts.load('800 40px P');
const T = window.TL, BT = 60 / T.bpm, bt = (b) => b * BT;
window.DURATION = T.beats * BT;
const C = { navy:'#1F2E57', orange:'#D23A10', salmon:'#FFC7A6', white:'#FFFFFF', gray:'#5B6170', green:'#0E7C4A', meh:'#8A5A00', blue:'#2F5FD0', bg:'#FBF7F3' };
const VC = { '직구각': C.green, '애매': C.meh, '국내가 나음': C.blue };
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const pg = (t, a, b) => cl((t - a) / (b - a));
const oc = (x) => 1 - Math.pow(1 - x, 3);
const o5 = (x) => 1 - Math.pow(1 - x, 5);
const iq = (x) => x * x;
const spring = (dt, f = 1.4, z = 0.32) => dt <= 0 ? 0 : 1 - Math.exp(-z * 2 * Math.PI * f * dt) * (Math.cos(2 * Math.PI * f * Math.sqrt(1 - z * z) * dt) + z / Math.sqrt(1 - z * z) * Math.sin(2 * Math.PI * f * Math.sqrt(1 - z * z) * dt));
const lerp = (a, b, p) => a + (b - a) * p;
const won = (n) => Math.round(n).toLocaleString('ko-KR') + '원';
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
const txt = (par, x, y, s, attrs) => { const e = el('text', { x, y, 'text-anchor': 'middle', 'dominant-baseline': 'middle', ...attrs }, par); e.textContent = s; return e; };
const $ = (id) => document.getElementById(id);
const RD = T.rounds;

// ── 자막(한 장면 12자 이내, 움직임이 되는 말) ──
const [[, p1, c1, v1, e1], [a2, p2, c2, v2, e2]] = T.R, [r1, r2] = RD;
const W0 = [['알리 그 가격,', 0.3, 3, 330, 130, 'navy', 'D'], ['나한테도?', 0.8, 3, 500, 170, 'orange', 'D'],
  ['첫 구매 특가는', 3, p1, 330, 110, 'navy', 'D'], ['처음 한 번만', 3.5, p1, 480, 130, 'orange', 'D']];
W0.push([r1.label, p1 + 0.15, e1, 300, 90, 'navy', 'D'], ['떼면 일반가', p1 + 0.4, v1, 450, 120, 'orange', 'D'], ['쿠팡이 더 싸요', v1, e1, 450, 120, 'blue', 'D'], [`${won(r1.diff)} 차이 · 쿠팡 ${r1.cpDate} 기준`, v1 + 0.5, e1, 1650, 56, 'gray', 'P']);
W0.push([r2.label, a2 + 0.15, e2, 300, 90, 'navy', 'D'], ['일반가로 재도', p2 + 0.2, v2, 450, 120, 'orange', 'D'], ['알리가 더 싸요', v2, e2, 450, 120, 'green', 'D'], [`${won(r2.diff)} 차이 · 쿠팡 ${r2.cpDate} 기준`, v2 + 0.5, e2, 1650, 56, 'gray', 'P']);
RD.forEach((r, i) => W0.push([r.verdict, T.R[i][3] + 0.15, T.R[i][4], 1535, 84, 'white', 'D', VC[r.verdict]]));
W0.push(['직구각은 일반가로 재요', T.site[0] + 0.25, T.site[1], 300, 84, 'white', 'D'], [`${T.date} 기준 · 알리 제휴 API 일반가`, T.site[0] + 0.6, T.site[1], 390, 40, 'salmon', 'P']);
W0.push(['알리 링크 붙여 넣고', T.cta[0] + 0.25, T.cta[1], 520, 120, 'navy', 'D'], ['일반가로 바로 판정', T.cta[0] + 0.75, T.cta[1], 680, 124, 'orange', 'D'], ['프로필 링크에 있어요', T.cta[0] + 2.5, T.cta[1], 1560, 54, 'gray', 'P']);
W0.push(['직구각', T.end, null, 1000, 160, 'white', 'D'], ['일반가로 다 더해서 판정', T.end, null, 1140, 54, 'white', 'P']);
const WD = W0.map(([text, b, out, y, size, col, font, pill]) => ({ text, b, out, y, size, col: C[col], font, pill }));
for (const w of WD) {
  const d = document.createElement('div'); d.className = 'w';
  d.style.cssText += `font-family:${w.font};font-weight:${w.font === 'D' ? 900 : 800};font-size:${w.size}px;color:${w.col}`;
  w.chars = [...w.text].map((ch) => { const sp = document.createElement('span'); sp.textContent = ch; d.appendChild(sp); return sp; });
  if (w.b >= T.end) d.style.clipPath = 'none';
  if (w.pill) { d.style.background = w.pill; d.style.padding = '6px 52px 12px'; d.style.borderRadius = '999px'; d.style.clipPath = 'none'; }
  $('words').appendChild(d); w.d = d;
}
let laid = false;
function layout() { for (const w of WD) { let r = w.d.getBoundingClientRect(); if (r.width > 960) { w.size = Math.floor(w.size * 960 / r.width); w.d.style.fontSize = w.size + 'px'; r = w.d.getBoundingClientRect(); } w.wd = r.width; w.hh = r.height; } laid = true; }
function word(w, t) {
  const t0 = bt(w.b);
  w.d.style.transform = `translate(${540 - w.wd / 2}px,${w.y - w.hh / 2}px)`;
  if (w.b >= T.end) { w.d.style.opacity = t >= bt(T.end) ? 1 : 0; return; }
  if (t < t0 || t >= bt(w.out)) { w.d.style.opacity = 0; return; }
  w.d.style.opacity = 1;
  if (w.pill) { const sp = spring(t - t0, 2.4, 0.35), q = pg(t, bt(w.out) - 0.16, bt(w.out)); w.d.style.transform += ` scale(${(2.2 - 1.2 * sp) * (1 - q)}) rotate(${(1 - cl(sp)) * -8}deg)`; }
  const big = w.size >= 100, out = bt(w.out), n = w.chars.length, st = big ? 0.03 : 0.012;
  w.chars.forEach((c, i) => {
    const dt = t - t0 - i * st, sp = big ? spring(dt, 2.0, 0.42) : oc(pg(dt, 0, 0.25));
    const q = pg(t, out - 0.16 + i * Math.min(0.008, 0.08 / n), out);
    c.style.transform = `translateY(${(1 - sp) * w.hh * 0.95 - q * w.hh * 1.2}px) rotate(${big ? (1 - cl(sp)) * 10 : 0}deg)`;
    c.style.opacity = (dt > 0 ? 1 : 0) * (1 - q);
  });
}

// ── 효과 ──
const G = $('g'), FX = $('fx');
function ring(par, x, y, t, t0, col, r0, r1, dur = 0.45, w = 16) { const p = pg(t, t0, t0 + dur); if (p <= 0 || p >= 1) return; el('circle', { cx: x, cy: y, r: r0 + (r1 - r0) * oc(p), fill: 'none', stroke: col, 'stroke-width': w * (1 - p) }, par); }
function burst(par, x, y, t, t0, col, n, r0, r1, dur = 0.35, w = 12) { const p = pg(t, t0, t0 + dur); if (p <= 0 || p >= 1) return; const rb = r0 + (r1 - r0) * oc(p), ra = r0 + (r1 - r0) * oc(cl(p * 1.7 - 0.7)); for (let i = 0; i < n; i++) { const a = 2 * Math.PI * i / n + 0.2; el('line', { x1: x + Math.cos(a) * ra, y1: y + Math.sin(a) * ra, x2: x + Math.cos(a) * rb, y2: y + Math.sin(a) * rb, stroke: col, 'stroke-width': w * (1 - p), 'stroke-linecap': 'round' }, par); } }
function confetti(par, x, y, t, t0, seed, cols, n = 30, dur = 1.0) { const tt = t - t0; if (tt <= 0 || tt >= dur) return; let s = seed; const rd = () => ((s = (s * 16807) % 2147483647) / 2147483647); for (let i = 0; i < n; i++) { const a = rd() * 2 * Math.PI, v = 700 + rd() * 700, k = (1 - Math.exp(-tt * 4)) / 4, sz = (14 + rd() * 14) * (1 - 0.5 * tt / dur); const px = x + Math.cos(a) * v * k, py = y + Math.sin(a) * v * k + 1300 * tt * tt; el('rect', { x: px - sz / 2, y: py - sz / 4, width: sz, height: sz / 2, rx: 3, fill: cols[i % cols.length], transform: `rotate(${(rd() * 360 + tt * 600) % 360} ${px} ${py})` }, par); } }

// ── 가격표: 알리(주황 머리)에 '첫 구매 특가' 스티커 → 떼면 일반가, 쿠팡(남색 머리)이 옆에 걸림 ──
const TW = 360, TH = 470, TY = 1050;
const star = (r0, r1, n = 18) => { let d = ''; for (let i = 0; i < n * 2; i++) { const a = Math.PI * i / n - Math.PI / 2, r = i % 2 ? r1 : r0; d += (i ? 'L' : 'M') + (Math.cos(a) * r).toFixed(1) + ' ' + (Math.sin(a) * r).toFixed(1); } return d + 'Z'; };
const STAR = star(165, 140);
function tag(par, x, y, rot, sc, head, hc, name, price, op = 1) {
  el('line', { x1: x, y1: 640, x2: x, y2: y - TH / 2 + 30, stroke: C.gray, 'stroke-width': 4, opacity: op * 0.6 }, par);
  const g = el('g', { transform: `translate(${x} ${y}) rotate(${rot} 0 ${-TH / 2 + 30}) scale(${sc})`, opacity: op }, par);
  el('rect', { x: -TW / 2 + 8, y: -TH / 2 + 14, width: TW, height: TH, rx: 34, fill: '#000', opacity: 0.08 }, g);
  el('rect', { x: -TW / 2, y: -TH / 2, width: TW, height: TH, rx: 34, fill: '#fff', stroke: hc, 'stroke-width': 6 }, g);
  el('path', { d: `M${-TW / 2} ${-TH / 2 + 34} Q${-TW / 2} ${-TH / 2} ${-TW / 2 + 34} ${-TH / 2} L${TW / 2 - 34} ${-TH / 2} Q${TW / 2} ${-TH / 2} ${TW / 2} ${-TH / 2 + 34} L${TW / 2} ${-TH / 2 + 120} L${-TW / 2} ${-TH / 2 + 120} Z`, fill: hc }, g);
  el('circle', { cx: 0, cy: -TH / 2 + 30, r: 13, fill: C.bg, stroke: '#fff', 'stroke-width': 4 }, g);
  txt(g, 0, -TH / 2 + 80, head, { 'font-family': 'D', 'font-size': 52, fill: '#fff' });
  txt(g, 0, -TH / 2 + 172, name, { class: 'lbl', 'font-size': 34, fill: C.navy });
  if (price) { txt(g, 0, 30, price[0], { class: 'lbl', 'font-size': 34, fill: C.gray }); txt(g, 0, 100, price[1], { 'font-family': 'D', 'font-size': 76, fill: hc, transform: `translate(0 100) scale(${price[2] ?? 1}) translate(0 -100)` }); }
  return g;
}
function drawTags(t) {
  T.R.forEach(([a, peel, cp, v, e], i) => {
    const r = RD[i], t0 = bt(a), tE = bt(e);
    if (t < t0 || t >= tE + 0.35) return;
    const leave = oc(pg(t, tE, tE + 0.35));
    const sw = spring(t - t0 - 0.05, 1.1, 0.22), rot0 = (1 - sw) * 24 * (i ? -1 : 1);
    const slide = spring(t - bt(cp) + 0.3, 1.8, 0.45);
    const ax = lerp(540, 290, slide), cx = lerp(1420, 790, slide);
    const vt = t - bt(v), aliWin = r.ali < r.cp;
    const win = (isAli) => vt < 0 ? 1 : (isAli === aliWin ? 1 + 0.08 * spring(vt, 2.4, 0.4) : 1);
    const dim = (isAli) => vt < 0 || isAli === aliWin ? 1 : 1 - 0.45 * oc(pg(vt, 0, 0.3));
    const yy = TY - (1 - sw) * 900 - leave * 1400;
    // 알리 가격표 + 일반가(스티커 아래)
    const peelT = t - bt(peel), rev = spring(peelT, 2.4, 0.4);
    const aliPrice = peelT >= 0 ? ['일반가', won(r.ali), 0.4 + 0.6 * rev] : null;
    const g = tag(G, ax, yy, rot0 + (vt >= 0 && !aliWin ? 4 * oc(pg(vt, 0, 0.3)) : 0), win(true), '알리', C.orange, r.label, aliPrice, dim(true));
    // 스티커: 질문 동안 떨리고, 떼는 순간 왼쪽 위로 날아감
    if (peelT < 0.6) {
      const wob = i === 0 ? Math.sin(t * 34) * 6 * pg(t, bt(3), bt(3) + 0.2) : 0;
      const q = pg(peelT, 0, 0.6), fly = iq(q);
      const sg = el('g', { transform: `translate(${-fly * 520} ${60 - fly * 900}) rotate(${wob - 8 - fly * 160}) scale(${1 + 0.25 * fly})`, opacity: 1 - pg(q, 0.7, 1) }, g);
      el('path', { d: STAR, fill: C.orange }, sg);
      el('path', { d: star(150, 128), fill: 'none', stroke: '#fff', 'stroke-width': 4, 'stroke-dasharray': '10 8' }, sg);
      txt(sg, 0, -38, '첫 구매 특가', { class: 'lbl', 'font-size': 36, fill: '#fff' });
      txt(sg, 0, 30, '₩??,???', { 'font-family': 'D', 'font-size': 64, fill: '#fff' });
    }
    if (peelT >= 0) { ring(FX, ax, yy + 100, t, bt(peel), C.orange, 40, 260, 0.4, 12); burst(FX, ax, yy + 100, t, bt(peel), C.orange, 12, 120, 230, 0.3, 9); }
    // 쿠팡 가격표
    if (t >= bt(cp) - 0.3) tag(G, cx, TY - leave * 1400, (1 - slide) * -10, win(false), '쿠팡', C.navy, r.label, ['쿠팡 판매가', won(r.cp), 1], dim(false));
    // 판정: 싼 쪽에 고리·방사선(직구각이면 색종이)
    const wx = aliWin ? ax : cx, col = VC[r.verdict];
    ring(FX, wx, TY + 40, t, bt(v), col, 80, 380, 0.45, 16); burst(FX, wx, TY + 40, t, bt(v), col, 14, 140, 300, 0.35, 10);
    if (r.verdict === '직구각') confetti(FX, wx, TY - 100, t, bt(v), 5 + i, [col, C.orange, C.salmon, C.navy]);
  });
}
// ── 사이트 화면: 휴대폰 안 실제 상품 페이지, 판정 칸 → 합계 줄 ──
const site = $('site');
const phone = el('g', {}, site);
const PW = 560, PH = 1010, [IMGW, IMGH] = T.shot;
el('rect', { x: -PW / 2, y: 0, width: PW, height: PH, rx: 56, fill: '#0F1A38' }, phone);
el('rect', { x: -PW / 2 + 16, y: 16, width: PW - 32, height: PH - 32, rx: 44, fill: '#FFFFFF' }, phone);
const clip = el('clipPath', { id: 'scr' }, el('defs', {}, phone)); el('rect', { x: -PW / 2 + 16, y: 16, width: PW - 32, height: PH - 32, rx: 44 }, clip);
const IW = PW - 32, IH = IW * IMGH / IMGW;
el('image', { href: 'site.png', x: -IW / 2, y: 16, width: IW, height: IH, 'clip-path': 'url(#scr)', preserveAspectRatio: 'xMidYMin slice' }, phone);
const hl = el('rect', { fill: 'none', stroke: C.orange, 'stroke-width': 8, rx: 16 }, phone);
function drawSite(t) {
  const [a, b] = T.site; if (t < bt(a) || t >= bt(b)) { phone.setAttribute('opacity', 0); return; }
  const sp = spring(t - bt(a) - 0.1, 1.6, 0.42), leave = pg(t, bt(b) - 0.2, bt(b));
  phone.setAttribute('opacity', 1 - leave);
  phone.setAttribute('transform', `translate(540 ${470 + (1 - sp) * 1400 - leave * 300}) rotate(${(1 - cl(sp)) * 8})`);
  const R0 = T.rows, seq = [[a + 1.5, R0.hero], [a + 2.5, R0['합계']]].filter((s) => s[1]);
  let k = -1; seq.forEach(([bb], i) => { if (t >= bt(bb)) k = i; });
  if (k < 0) { hl.setAttribute('opacity', 0); return; }
  const cur = seq[k][1], prv = seq[Math.max(0, k - 1)][1], m = k ? oc(pg(t, bt(seq[k][0]), bt(seq[k][0]) + 0.18)) : oc(pg(t, bt(seq[0][0]), bt(seq[0][0]) + 0.25));
  const y0 = lerp(prv.y0, cur.y0, k ? m : 1), y1 = lerp(prv.y1, cur.y1, k ? m : 1);
  hl.setAttribute('opacity', 1); hl.setAttribute('x', -IW / 2 + 10); hl.setAttribute('width', (IW - 20) * (k ? 1 : m));
  hl.setAttribute('y', 16 + y0 * IH - 6); hl.setAttribute('height', (y1 - y0) * IH + 12); hl.setAttribute('stroke-width', k === 1 ? 11 : 8);
}
// ── 끝 요청: 입력 칸에 알리 링크가 붙고 → 판정 도장 ──
function drawCta(t) {
  const g = $('cta'); g.innerHTML = '';
  const [a] = T.cta; if (t < bt(a) || t >= bt(T.end)) return;
  const s = spring(t - bt(a), 1.8, 0.35), cg = el('g', { transform: `translate(540 1100) scale(${s})` }, g);
  el('rect', { x: -430, y: -90, width: 860, height: 180, rx: 40, fill: '#fff', stroke: C.navy, 'stroke-width': 8 }, cg);
  const link = 'aliexpress.com/item/…', n = Math.min(link.length, Math.max(0, Math.floor((t - bt(a + 1.5)) / 0.05) + 1));
  const tx = el('text', { x: -380, y: 4, 'dominant-baseline': 'middle', class: 'lbl', 'font-size': 50, fill: C.navy }, cg); tx.textContent = t >= bt(a + 1.5) ? link.slice(0, n) : '';
  if (Math.floor((t - bt(a)) * 2.5) % 2 === 0 && t < bt(a + 3)) el('rect', { x: -380 + (t >= bt(a + 1.5) ? n * 27 : 0), y: -34, width: 6, height: 68, fill: C.orange }, cg);
  const ps = spring(t - bt(a + 3), 2.4, 0.38); if (ps <= 0) return;
  const pgp = el('g', { transform: `translate(540 1330) scale(${2.2 - 1.2 * ps}) rotate(${(1 - cl(ps)) * -8})` }, g);
  el('rect', { x: -170, y: -62, width: 340, height: 124, rx: 62, fill: C.orange }, pgp);
  txt(pgp, 0, 4, '바로 판정', { 'font-family': 'D', 'font-size': 64, fill: '#fff' });
  ring(g, 540, 1330, t, bt(a + 3), C.orange, 60, 320, 0.45, 14);
}
// ── 배경: 남색 구간 ──
function drawBg(t) {
  const b2 = $('bg2'); b2.style.background = C.navy; let cp = 'circle(0px at 0 0)';
  for (const [a, c] of T.navy) {
    if (t >= bt(a) - 0.06 && t < bt(c) - 0.05) cp = `circle(${1.06 * Math.hypot(540, 1100) * o5(pg(t, bt(a) - 0.06, bt(a) + 0.26))}px at 540px 1060px)`;
    else if (t >= bt(c) - 0.05 && t < bt(c) + 0.2) { const e = oc(pg(t, bt(c) - 0.05, bt(c) + 0.2)), edge = -400 + 1880 * e; cp = `polygon(${edge + 300}px 0, 2000px 0, 2000px 1920px, ${edge - 300}px 1920px)`; }
  }
  b2.style.clipPath = cp;
}
// ── 로고 ──
const lgG = $('logo');
const lgH = el('rect', { fill: '#fff' }, lgG), lgV = el('rect', { fill: '#fff' }, lgG), lgS = el('rect', { fill: C.navy }, lgG);
el('rect', { x: 280, y: 1215, width: 520, height: 94, rx: 47, fill: C.navy }, lgG);
const urlT = el('text', { x: 540, y: 1262, 'text-anchor': 'middle', 'dominant-baseline': 'middle', fill: '#fff', class: 'lbl', 'font-size': 42 }, lgG); urlT.textContent = 'www.jikgugak.com';
(() => { const cx = 540, cy = 690, k = 300 / 522, X = (u) => cx - 150 + u * k, Y = (v) => cy - 150 + v * k;
  lgH.setAttribute('x', X(20)); lgH.setAttribute('y', Y(20)); lgH.setAttribute('height', 77 * k); lgH.setAttribute('rx', 38 * k); lgH.setAttribute('width', 482 * k);
  lgV.setAttribute('x', X(425)); lgV.setAttribute('y', Y(20)); lgV.setAttribute('width', 77 * k); lgV.setAttribute('rx', 38 * k); lgV.setAttribute('height', 482 * k);
  const hs = 96 * k; lgS.setAttribute('x', X(154) - hs); lgS.setAttribute('y', Y(386) - hs); lgS.setAttribute('width', 2 * hs); lgS.setAttribute('height', 2 * hs); lgS.setAttribute('rx', 40 * k); })();
// ── 카메라(그래픽만): 스티커 뗄 때·쿠팡 착지에 살짝, 판정에 크게 ──
function cam(t) {
  let z = 0, rot = 0, sx = 0, sy = 0;
  const hit = (b, amt, sh, tl) => { const d = t - bt(b); if (d >= 0 && d < 0.5) z = Math.max(z, amt * Math.exp(-d * 8)); if (sh && d >= 0 && d < 0.22) { const a = sh * (1 - d / 0.22); sx = a * Math.sin(d * 95); sy = 0.7 * a * Math.cos(d * 81); } if (tl && d >= 0 && d < 1.2) rot += tl * (1 - spring(d, 2.2, 0.3)); };
  for (let k = 6; k < 24; k++) { const d = t - bt(k); if (d >= 0 && d < 0.35) z = Math.max(z, 0.012 * Math.exp(-d * 12)); }
  T.R.forEach(([, peel, cp, v], i) => { hit(peel, 0.04, 6, 0); hit(cp, 0.03, 0, 0); hit(v, 0.08, 14, i ? 2.5 : -2.5); });
  return `translate(${sx}px,${sy}px) rotate(${rot}deg) scale(${1 + z})`;
}

const LEAD = 0.04;
window.seek = (t0) => {
  const t = t0 + LEAD;
  if (!laid) layout();
  G.innerHTML = ''; FX.innerHTML = '';
  drawBg(t); drawTags(t); drawSite(t); drawCta(t);
  $('endbg').style.background = t >= bt(T.end) ? C.orange : 'transparent';
  lgG.setAttribute('opacity', t >= bt(T.end) ? 1 : 0);
  for (const w of WD) word(w, t);
  $('cam').style.transform = cam(t);
};
